<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500&display=swap" rel="stylesheet">

<title>Valentine 💖</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(180deg,#ffd6e7,#ff8fb8);
  overflow:hidden;
  font-family:Poppins;
}

/* ===== FLOATING HEARTS — FIXED ===== */
.heart{
  position:fixed;
  bottom:-40px;
  font-size:22px;
  opacity:.85;
  pointer-events:none;
  animation:floatUp linear forwards;
}

@keyframes floatUp{
  from { transform:translateY(0); opacity:.9; }
  to   { transform:translateY(-120vh); opacity:0; }
}

/* ===== CARD ===== */
.card{
  background:#fff6f9;
  padding:40px;
  width:390px;
  border-radius:30px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.15);
  z-index:5;
}

/* ===== TITLE ===== */
.title{
  font-family:"Great Vibes",cursive;
  font-size:42px;
  color:#d63384;
  line-height:1.2;
  animation:nameFloat 3s ease-in-out infinite;
  text-shadow:0 0 12px rgba(255,80,140,.35);
}

@keyframes nameFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}

/* sticky hearts near name */
.stickHearts{
  font-size:28px;
  margin-left:6px;
  animation:heartPulse 1.8s infinite;
}

@keyframes heartPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.25)}
}

.subtitle{
  margin-top:12px;
  color:#666;
  font-size:15px;
}

/* ===== BUTTONS ===== */
.row{
  display:flex;
  justify-content:center;
  gap:14px;
  margin-top:24px;
}

.btn{
  padding:15px 30px;
  border:none;
  border-radius:40px;
  font-size:18px;
  cursor:pointer;
}

.yes{
  background:linear-gradient(180deg,#ff5c7c,#ff2f55);
  color:white;
  box-shadow:0 10px 25px rgba(255,47,85,.4);
  transition:.2s;
}
.yes:hover{transform:scale(1.08)}

.no{
  background:#eee;
  position:relative;
}

/* ===== POPUP TEASE ===== */
.popup{
  position:fixed;
  background:#ff4d6d;
  color:white;
  padding:8px 16px;
  border-radius:20px;
  font-size:14px;
  animation:pop .9s forwards;
  z-index:20;
}

@keyframes pop{
  from{opacity:0; transform:scale(.5)}
  to{opacity:1; transform:scale(1)}
}
</style>
</head>

<body>

<div class="card" id="card">

  <div class="title">
    Durga Garu, A small surprise for the one who supported me in every situation<br>
    <span class="stickHearts">💗💞</span><br>
    will you be my Valentine?
  </div>

  <div class="subtitle">
    I already know the answer, but I still want to hear it 🥺
  </div>

  <div class="row">
    <button class="btn yes" id="yesBtn">Yes ❤️</button>
    <button class="btn no" id="noBtn">No 😜</button>
  </div>

</div>

<script>
/* ===== FLOATING HEART ENGINE (FIXED) ===== */
const hearts=["💗","💖","💞","💕","💘"];

setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML=hearts[Math.random()*hearts.length|0];
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(18+Math.random()*18)+"px";
  h.style.animationDuration=(6+Math.random()*4)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),9000);
},500);


/* ===== RUNNING NO BUTTON ===== */
const noBtn=document.getElementById("noBtn");

const tease=[
"Missed me 😎",
"Can't touch me 😜",
"Try again 🏃",
"Too slow 😂",
"Catch me if you can 😏"
];

function teasePopup(){
  const p=document.createElement("div");
  p.className="popup";
  p.innerHTML=tease[Math.random()*tease.length|0];
  p.style.left=Math.random()*80+"vw";
  p.style.top=Math.random()*80+"vh";
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),900);
}

function moveNo(){
  noBtn.style.transform=`translate(${Math.random()*220-110}px,
                                   ${Math.random()*160-80}px)`;
  teasePopup();
}

noBtn.onmouseover=moveNo;
noBtn.ontouchstart=moveNo;


/* ===== YES CELEBRATION ===== */
document.getElementById("yesBtn").onclick=()=>{
  document.getElementById("card").innerHTML=`
    <div class="title">Yay!! I knew you'd say yes 💖</div>
    <div class="subtitle">
      Thank you for standing by me in every situation 🥰<br><br>
      I’ll never forget your support and kindness 🌸<br><br>
      Lots of love and respect 🤗<br>
      Come here and give me a hug 🤗❤️
    </div>
  `;

  // celebration hearts burst
  setInterval(()=>{
    for(let i=0;i<6;i++){
      const h=document.createElement("div");
      h.className="heart";
      h.innerHTML="💖";
      h.style.left=Math.random()*100+"vw";
      h.style.fontSize="28px";
      h.style.animationDuration="5s";
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),7000);
    }
  },250);
};
</script>

</body>
</html>
